title: "Inventory App"
description: "This andriod app was meant to be used to manage a warehouse inventory"
readME: "This app was originally made for a CS360 class and is being updated for a CS capstone class. The course outcome that I have achieved so far is number 5 which was enhancing security. This was accomplished by implementing a login and register feature. I also accomplished number 3 by providing solutions to the table display problem. Making the table display properly required implementing several different solutions and tradeoffs had to be made in reusability for functionality. Outcome 2 was met by having names and messages be professional and clear in their meaning and adheres to the appropriate context. Outcome 4 wants well-founded skills and tools to deliver value and computer solutions which were done by using logCat messages and created database files to ensure that the code was functional and working as intended. The strategy that accomplished outcome 1 of enabling diverse audiences was using device manager to make sure the layout wouldn’t be messed up on other devices. Meaning that there is no course outcomes left to accomplish. Link to the review of the [original code] (https://youtu.be/JK81tap9QD0)"
